<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sales Savvy | Next-Gen Intelligent E-Commerce</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- Obsidian Luxe & Auric Luminescence Design System -->
  <link rel="stylesheet" href="./src/styles/theme.css">
  <style>
    :root {
      --bg-primary: #090D16;
      --bg-secondary: #0F172A;
      --bg-tertiary: #162036;
      --surface-card: rgba(22, 32, 54, 0.7);
      --surface-glass: rgba(15, 23, 42, 0.75);
      --surface-hover: rgba(30, 41, 69, 0.9);
      --border-subtle: rgba(255, 255, 255, 0.07);
      --border-active: rgba(245, 158, 11, 0.4);
      --border-highlight: rgba(99, 102, 241, 0.35);
      --glow-auric: 0 0 24px -4px rgba(245, 158, 11, 0.25);
      --glow-indigo: 0 0 30px -6px rgba(99, 102, 241, 0.3);
      --accent-primary: #F59E0B;
      --accent-light: #FBBF24;
      --accent-dark: #D97706;
      --accent-gradient: linear-gradient(135deg, #F59E0B 0%, #FBBF24 50%, #D97706 100%);
      --indigo-accent: #6366F1;
      --indigo-gradient: linear-gradient(135deg, #6366F1 0%, #8B5CF6 100%);
      --accent-emerald: #10B981;
      --success: #10B981;
      --danger: #EF4444;
      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --text-inverted: #090D16;
      --font-heading: 'Plus Jakarta Sans', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-full: 9999px;
      --transition-fast: 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-body);
      line-height: 1.6;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(245, 158, 11, 0.06) 0%, transparent 45%);
      background-attachment: fixed;
    }

    .container { max-width: 1280px; margin: 0 auto; padding: 0 24px; }
    .app-shell { min-height: 100vh; display: flex; flex-direction: column; }
    .main-viewport { flex: 1; }
    .page-content { padding-bottom: 60px; }

    /* Navbar */
    .navbar {
      position: sticky; top: 0; z-index: 100;
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      background: rgba(9, 13, 22, 0.85);
      border-bottom: 1px solid var(--border-subtle);
    }
    .nav-content { display: flex; align-items: center; justify-content: space-between; gap: 20px; height: 74px; }
    .nav-brand { display: flex; align-items: center; gap: 10px; cursor: pointer; font-family: var(--font-heading); font-weight: 800; font-size: 1.25rem; letter-spacing: 1px; }
    .brand-logo-icon { width: 38px; height: 38px; border-radius: 10px; background: var(--accent-gradient); color: var(--text-inverted); display: flex; align-items: center; justify-content: center; font-weight: 900; box-shadow: 0 0 15px rgba(245, 158, 11, 0.4); }
    .brand-accent { color: var(--accent-primary); }
    .nav-search-bar { position: relative; flex: 1; max-width: 480px; display: flex; align-items: center; background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 0 14px; gap: 10px; transition: var(--transition-fast); }
    .nav-search-bar:focus-within { border-color: var(--accent-primary); box-shadow: 0 0 16px rgba(245, 158, 11, 0.2); }
    .nav-search-bar input { background: transparent; border: none; color: var(--text-primary); font-size: 0.92rem; width: 100%; outline: none; padding: 10px 0; font-family: inherit; }
    .nav-search-bar svg { color: var(--text-secondary); flex-shrink: 0; }
    .search-clear-btn { background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 1.2rem; }
    .nav-actions { display: flex; align-items: center; gap: 12px; }
    .nav-btn { background: transparent; border: none; color: var(--text-secondary); font-weight: 600; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 0.92rem; transition: var(--transition-fast); display: flex; align-items: center; gap: 8px; font-family: inherit; }
    .nav-btn:hover, .nav-btn.active { color: var(--text-primary); background: rgba(255, 255, 255, 0.06); }
    .cart-btn { position: relative; background: rgba(245, 158, 11, 0.1); color: var(--accent-light); border: 1px solid rgba(245, 158, 11, 0.25); }
    .cart-btn:hover { background: rgba(245, 158, 11, 0.2); }
    .cart-badge { position: absolute; top: -6px; right: -6px; background: var(--danger); color: #FFF; border-radius: var(--radius-full); font-size: 0.72rem; font-weight: 700; min-width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; padding: 0 4px; box-shadow: 0 2px 8px rgba(239, 68, 68, 0.5); }
    .user-profile-widget { display: flex; align-items: center; gap: 10px; }
    .profile-pill { display: flex; align-items: center; gap: 10px; background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); padding: 4px 10px 4px 6px; border-radius: var(--radius-full); }
    .user-avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--indigo-gradient); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; }
    .user-info-text { display: flex; flex-direction: column; line-height: 1.1; }
    .user-name { font-size: 0.82rem; font-weight: 600; color: var(--text-primary); }
    .user-role-badge { font-size: 0.65rem; font-weight: 700; color: var(--accent-light); letter-spacing: 0.5px; }
    .logout-btn { background: transparent; border: none; color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; padding: 4px; border-radius: 6px; }
    .logout-btn:hover { color: var(--danger); }
    .auth-action-group { display: flex; gap: 8px; }

    /* Buttons & Badges */
    .btn { font-family: inherit; font-weight: 600; border-radius: 10px; padding: 10px 20px; cursor: pointer; transition: var(--transition-fast); display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.92rem; border: none; }
    .btn-primary { background: var(--accent-gradient); color: var(--text-inverted); box-shadow: 0 4px 16px rgba(245, 158, 11, 0.35); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 22px rgba(245, 158, 11, 0.5); }
    .btn-outline { background: transparent; border: 1px solid rgba(255, 255, 255, 0.15); color: var(--text-primary); }
    .btn-outline:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.3); }
    .btn-sm { padding: 6px 12px; font-size: 0.82rem; border-radius: 6px; }
    .btn-lg { padding: 14px 28px; font-size: 1.05rem; border-radius: 12px; }
    .btn-block { width: 100%; }
    .badge { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: var(--radius-full); font-size: 0.75rem; font-weight: 700; letter-spacing: 0.5px; }
    .badge-accent { background: rgba(245, 158, 11, 0.15); color: var(--accent-light); border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-success { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }

    /* Hero */
    .hero-section { padding: 70px 0 50px; position: relative; overflow: hidden; }
    .hero-container { max-width: 900px; text-align: center; margin: 0 auto; }
    .hero-pill { display: inline-flex; align-items: center; gap: 8px; background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.25); padding: 6px 16px; border-radius: var(--radius-full); font-size: 0.85rem; font-weight: 600; color: var(--accent-light); margin-bottom: 20px; }
    .pulse-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-emerald); box-shadow: 0 0 10px var(--accent-emerald); }
    .hero-title { font-size: 3.6rem; line-height: 1.15; font-weight: 800; margin-bottom: 20px; letter-spacing: -0.03em; }
    .gradient-text { background: linear-gradient(135deg, #F59E0B 0%, #FBBF24 50%, #818CF8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .hero-subtitle { font-size: 1.15rem; color: var(--text-secondary); line-height: 1.7; max-width: 680px; margin: 0 auto 36px; }
    .hero-cta-group { display: flex; flex-direction: column; align-items: center; gap: 28px; }
    .hero-stat-pills { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
    .stat-pill { background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255, 255, 255, 0.08); padding: 10px 18px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; }
    .stat-val { font-weight: 800; color: var(--text-primary); font-size: 1.05rem; font-family: var(--font-mono); }
    .stat-lbl { font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }

    /* Catalog */
    .catalog-section { padding: 40px 0 80px; }
    .catalog-header { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 20px; margin-bottom: 36px; }
    .section-title { font-size: 2rem; font-weight: 800; margin-bottom: 6px; }
    .section-sub { color: var(--text-secondary); font-size: 0.95rem; }
    .filter-pill-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-pill { background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); color: var(--text-secondary); padding: 8px 16px; border-radius: var(--radius-full); font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: var(--transition-fast); font-family: inherit; }
    .filter-pill:hover, .filter-pill.active { background: rgba(245, 158, 11, 0.15); border-color: var(--accent-primary); color: var(--accent-light); }
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 28px; }
    .product-card { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    .product-card:hover { transform: translateY(-6px); border-color: rgba(245, 158, 11, 0.4); box-shadow: 0 16px 36px -10px rgba(0, 0, 0, 0.6), 0 0 24px -6px rgba(245, 158, 11, 0.2); }
    .product-img-wrapper { position: relative; height: 240px; overflow: hidden; cursor: pointer; background: #000; }
    .product-img-wrapper img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
    .product-card:hover .product-img-wrapper img { transform: scale(1.06); }
    .product-cat-tag { position: absolute; top: 12px; left: 12px; background: rgba(9, 13, 22, 0.85); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.1); color: var(--text-primary); font-size: 0.75rem; font-weight: 600; padding: 4px 10px; border-radius: var(--radius-full); }
    .quick-view-overlay { position: absolute; inset: 0; background: rgba(9, 13, 22, 0.5); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s; color: var(--accent-light); font-weight: 700; font-size: 0.9rem; }
    .product-img-wrapper:hover .quick-view-overlay { opacity: 1; }
    .product-details { padding: 22px; display: flex; flex-direction: column; flex: 1; }
    .product-meta { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .stock-indicator { font-size: 0.78rem; font-weight: 600; }
    .stock-indicator.in-stock { color: var(--accent-emerald); }
    .stock-indicator.low-stock { color: var(--accent-primary); }
    .product-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; color: var(--text-primary); cursor: pointer; line-height: 1.3; }
    .product-title:hover { color: var(--accent-light); }
    .product-desc { color: var(--text-secondary); font-size: 0.88rem; line-height: 1.5; margin-bottom: 20px; flex: 1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .product-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: auto; padding-top: 16px; border-top: 1px solid rgba(255, 255, 255, 0.06); }
    .price-tag { display: flex; align-items: baseline; gap: 3px; }
    .currency { color: var(--accent-primary); font-weight: 700; font-size: 1.1rem; }
    .amount { font-size: 1.45rem; font-weight: 800; color: var(--text-primary); font-family: var(--font-mono); }
    .add-cart-btn { padding: 9px 16px; font-size: 0.88rem; }

    /* Cart */
    .cart-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
    .page-title { font-size: 2.2rem; font-weight: 800; margin-bottom: 6px; }
    .cart-layout { display: grid; grid-template-columns: 1fr 380px; gap: 32px; align-items: start; }
    @media (max-width: 900px) { .cart-layout { grid-template-columns: 1fr; } }
    .cart-items-container { display: flex; flex-direction: column; gap: 16px; }
    .cart-item-row { background: rgba(15, 23, 42, 0.75); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 18px; display: flex; align-items: center; gap: 20px; }
    .cart-thumb { width: 90px; height: 90px; object-fit: cover; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.08); }
    .cart-item-info { flex: 1; }
    .cart-cat { font-size: 0.75rem; color: var(--accent-primary); text-transform: uppercase; font-weight: 700; }
    .cart-title { font-size: 1.1rem; font-weight: 700; margin: 4px 0; color: var(--text-primary); }
    .cart-unit-price { font-size: 0.85rem; color: var(--text-secondary); }
    .quantity-stepper { display: flex; align-items: center; background: rgba(9, 13, 22, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; overflow: hidden; }
    .step-btn { background: none; border: none; color: var(--text-primary); padding: 6px 12px; font-size: 1.1rem; cursor: pointer; transition: background 0.2s; }
    .step-btn:hover { background: rgba(255, 255, 255, 0.1); }
    .quantity-num { padding: 0 8px; font-weight: 700; font-family: var(--font-mono); }
    .cart-row-total { font-size: 1.2rem; font-weight: 800; color: var(--text-primary); font-family: var(--font-mono); min-width: 110px; text-align: right; }
    .remove-item-btn { background: transparent; border: none; font-size: 1.2rem; cursor: pointer; padding: 6px; opacity: 0.7; transition: opacity 0.2s; }
    .remove-item-btn:hover { opacity: 1; }
    .cart-summary-card { background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 26px; }
    .summary-title { font-size: 1.3rem; font-weight: 800; margin-bottom: 20px; }
    .summary-line { display: flex; justify-content: space-between; margin-bottom: 14px; color: var(--text-secondary); font-size: 0.95rem; }
    .summary-line.note-line { font-size: 0.82rem; }
    .summary-line.total-line { color: var(--text-primary); font-weight: 800; font-size: 1.2rem; margin-top: 14px; }
    .grand-price { font-size: 1.5rem; color: var(--accent-light); font-family: var(--font-mono); }
    .summary-divider { height: 1px; background: rgba(255, 255, 255, 0.08); margin: 18px 0; }
    .checkout-btn { margin-top: 20px; padding: 14px; font-size: 1.05rem; }
    .security-guarantee { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 16px; font-size: 0.78rem; color: var(--text-secondary); }
    .empty-cart-view { padding: 80px 0; text-align: center; }
    .empty-cart-card { background: rgba(15, 23, 42, 0.75); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 24px; padding: 60px 24px; max-width: 500px; margin: 0 auto; }
    .empty-icon { font-size: 3.5rem; margin-bottom: 16px; }

    /* Modals & Razorpay */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .razorpay-modal-box { background: #0F172A; border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 16px; width: 100%; max-width: 480px; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8); }
    .razorpay-top-bar { background: #090D16; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
    .razorpay-text { font-weight: 800; font-size: 1.1rem; color: #3B82F6; }
    .razorpay-badge { font-size: 0.65rem; font-weight: 800; background: rgba(245, 158, 11, 0.2); color: var(--accent-light); padding: 3px 8px; border-radius: 4px; margin-left: 8px; }
    .modal-close-btn { background: none; border: none; color: var(--text-secondary); font-size: 1.5rem; cursor: pointer; line-height: 1; }
    .razorpay-order-banner { padding: 18px 20px; background: rgba(245, 158, 11, 0.05); border-bottom: 1px solid rgba(255, 255, 255, 0.08); display: flex; justify-content: space-between; align-items: center; }
    .rp-merchant { font-size: 0.85rem; color: var(--text-secondary); }
    .rp-amount { font-size: 1.6rem; font-weight: 800; color: var(--text-primary); font-family: var(--font-mono); }
    .rp-order-ref { text-align: right; font-size: 0.75rem; color: var(--text-secondary); }
    .rp-order-ref code { color: var(--accent-light); display: block; }
    .razorpay-body { padding: 20px; }
    .payment-tab-row { display: flex; gap: 6px; margin-bottom: 18px; background: rgba(9, 13, 22, 0.6); padding: 4px; border-radius: 10px; }
    .tab-btn { flex: 1; background: none; border: none; color: var(--text-secondary); padding: 8px 10px; border-radius: 8px; font-weight: 600; font-size: 0.82rem; cursor: pointer; transition: var(--transition-fast); font-family: inherit; }
    .tab-btn.active { background: var(--accent-primary); color: var(--text-inverted); }
    .payment-form-content { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
    .form-lbl { font-size: 0.82rem; font-weight: 600; color: var(--text-secondary); }
    .form-input { background: rgba(9, 13, 22, 0.8); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 10px; padding: 10px 14px; color: var(--text-primary); font-size: 0.95rem; outline: none; width: 100%; font-family: inherit; }
    .form-input:focus { border-color: var(--accent-primary); }
    .form-hint { font-size: 0.75rem; color: var(--text-muted); }
    .form-two-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .shipping-verify-box { background: rgba(9, 13, 22, 0.5); border: 1px solid rgba(255, 255, 255, 0.06); padding: 10px 14px; border-radius: 10px; margin-bottom: 18px; font-size: 0.82rem; }
    .shipping-verify-box .lbl { color: var(--text-secondary); margin-right: 6px; }
    .pay-cta { padding: 12px; font-size: 1rem; }

    /* Orders List */
    .orders-list { display: flex; flex-direction: column; gap: 20px; }
    .order-card { background: rgba(15, 23, 42, 0.75); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 18px; padding: 22px; }
    .order-card-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.06); margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
    .order-id { font-weight: 800; font-size: 1.1rem; margin-right: 12px; }
    .order-date { color: var(--text-secondary); font-size: 0.85rem; }
    .order-items-grid { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 16px; }
    .order-item-chip { display: flex; align-items: center; gap: 10px; background: rgba(9, 13, 22, 0.6); padding: 8px 12px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.06); }
    .item-chip-img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; }
    .item-chip-details { display: flex; flex-direction: column; }
    .item-chip-title { font-size: 0.85rem; font-weight: 600; }
    .item-chip-sub { font-size: 0.75rem; color: var(--text-secondary); }
    .order-card-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 14px; border-top: 1px solid rgba(255, 255, 255, 0.06); font-size: 0.88rem; flex-wrap: wrap; gap: 10px; }
    .order-address .lbl, .order-total-sum .lbl { color: var(--text-secondary); }
    .order-total-sum .val { font-weight: 800; color: var(--accent-light); font-family: var(--font-mono); font-size: 1.1rem; }

    /* Admin Dashboard */
    .admin-actions-top { display: flex; gap: 10px; }
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; margin-bottom: 32px; }
    .kpi-card { background: rgba(15, 23, 42, 0.75); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; }
    .kpi-title { font-size: 0.85rem; color: var(--text-secondary); text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; }
    .kpi-val { font-size: 1.8rem; font-weight: 800; color: var(--text-primary); margin: 8px 0 4px; font-family: var(--font-mono); }
    .kpi-sub { font-size: 0.78rem; color: var(--text-secondary); }
    .kpi-sub.positive { color: var(--accent-emerald); }
    .admin-section-block { margin-bottom: 40px; }
    .admin-section-title { font-size: 1.4rem; font-weight: 800; margin-bottom: 16px; }
    .admin-table-wrap { background: rgba(15, 23, 42, 0.75); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; overflow-x: auto; }
    .admin-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }

</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, createContext, useContext } = React;

    // ==========================================
    // INITIAL MOCK DATA & PERSISTENCE ENGINE
    // ==========================================
    const DEFAULT_CATEGORIES = [
      { categoryId: 1, categoryName: "Electronics", description: "Smartphones, Audio, and Gadgets" },
      { categoryId: 2, categoryName: "Fashion", description: "Apparel, Footwear and Accessories" },
      { categoryId: 3, categoryName: "Home & Living", description: "Modern furniture, decor and appliances" },
      { categoryId: 4, categoryName: "Wellness", description: "Skincare, grooming, and health" }
    ];

    const DEFAULT_PRODUCTS = [
      {
        productId: 1,
        title: "Aura Sound Pro ANC Headphones",
        description: "Studio-grade wireless spatial audio with 45dB hybrid active noise cancellation, beryllium drivers, and 48-hour battery longevity.",

        stockQuantity: 24,

        images: [{ imageId: 101, imageUrl: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=800&q=80" }]
      },
      {
        productId: 2,
        title: "Chronos Obsidian Chronograph Watch",
        description: "Sapphire crystal aerospace titanium watch featuring precision Japanese automatic movement and waterproof silicone strap.",
        price: 12999.00,
        stockQuantity: 15,
        category: { categoryId: 2, categoryName: "Fashion" },
        images: [{ imageId: 102, imageUrl: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=800&q=80" }]
      },
      {
        productId: 3,
        title: "Lumina Minimalist Ergonomic Desk Lamp",
        description: "Smart ambient dimming desk light with CRI>98 sunlight simulation, wireless Qi charging pad base, and anodized aluminum body.",
        price: 4499.00,
        stockQuantity: 30,
        category: { categoryId: 3, categoryName: "Home & Living" },
        images: [{ imageId: 103, imageUrl: "https://images.unsplash.com/photo-1507473885765-e6ed057f782c?w=800&q=80" }]
      },
      {
        productId: 4,
        title: "CyberVision 4K OLED Portable Monitor",
        description: "15.6-inch 120Hz HDR600 OLED panel with 100% DCI-P3 color gamut, dual USB-C Thunderbolt input, and ultra-slim magnetic kickstand.",
        price: 26999.00,
        stockQuantity: 8,
        category: { categoryId: 1, categoryName: "Electronics" },
        images: [{ imageId: 104, imageUrl: "https://images.unsplash.com/photo-1527443224154-c4a3942d3acf?w=800&q=80" }]
      },
      {
        productId: 5,
        title: "Nomad Artisan Full-Grain Leather Backpack",
        description: "Handcrafted water-resistant vegetable-tanned leather pack with dedicated padded 16-inch laptop chamber and hidden passport compartment.",
        price: 8999.00,
        stockQuantity: 19,
        category: { categoryId: 2, categoryName: "Fashion" },
        images: [{ imageId: 105, imageUrl: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=800&q=80" }]
      },
      {
        productId: 6,
        title: "Zenith Botanical Recovery Serum (50ml)",
        description: "Cold-pressed squalane and peptide infusion formulated for 72-hour moisture barrier restoration and cellular rejuvenation.",
        price: 2499.00,
        stockQuantity: 50,
        category: { categoryId: 4, categoryName: "Wellness" },
        images: [{ imageId: 106, imageUrl: "https://images.unsplash.com/photo-1620916566398-39f1143ab7be?w=800&q=80" }]
      }
    ];

    // LocalStorage State Manager
    function getStoredData(key, fallback) {
      try {
        const item = localStorage.getItem(key);
        return item ? JSON.parse(item) : fallback;
      } catch (e) {
        return fallback;
      }
    }

    function setStoredData(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (e) {
        console.error("Storage error", e);
      }
    }

    // ==========================================
    // APP CONTEXT
    // ==========================================
    const AppContext = createContext();

    function AppProvider({ children }) {
      const [currentUser, setCurrentUser] = useState(() => 
        getStoredData('sales_savvy_user', {
          userId: 1,
          name: "John Doe",
          email: "john@kodnest.com",
          role: "CUSTOMER",
          address: "123 Indiranagar, Bangalore, Karnataka"
        })
      );

      const [products, setProducts] = useState(() => 
        getStoredData('sales_savvy_products', DEFAULT_PRODUCTS)
      );

      const [categories, setCategories] = useState(() => 
        getStoredData('sales_savvy_categories', DEFAULT_CATEGORIES)
      );

      const [cart, setCart] = useState(() => 
        getStoredData('sales_savvy_cart', [
          { cartId: 1, product: DEFAULT_PRODUCTS[0], quantity: 1 }
        ])
      );

      const [orders, setOrders] = useState(() => 
        getStoredData('sales_savvy_orders', [
          {
            orderId: 901,
            orderDate: "2026-10-10 14:32:00",
            totalAmount: 13369.00,
            status: "PAID",
            paymentMethod: "RAZORPAY",
            razorpayPaymentId: "pay_TEST_DEMO_99812",
            shippingAddress: "123 Indiranagar, Bangalore, Karnataka",
            items: [
              {
                orderItemId: 1,
                product: DEFAULT_PRODUCTS[1],
                quantity: 1,
                pricePerUnit: 12999.00
              }
            ]
          }
        ])
      );

      const [activePage, setActivePage] = useState('home');
      const [selectedCategory, setSelectedCategory] = useState('ALL');
      const [searchQuery, setSearchQuery] = useState('');
      const [toast, setToast] = useState(null);
      const [quickViewProduct, setQuickViewProduct] = useState(null);
      const [isRazorpayOpen, setIsRazorpayOpen] = useState(false);

      useEffect(() => { setStoredData('sales_savvy_user', currentUser); }, [currentUser]);
      useEffect(() => { setStoredData('sales_savvy_products', products); }, [products]);
      useEffect(() => { setStoredData('sales_savvy_cart', cart); }, [cart]);
      useEffect(() => { setStoredData('sales_savvy_orders', orders); }, [orders]);

      const showToast = (message, type = 'success') => {
        setToast({ id: Date.now(), message, type });
        setTimeout(() => setToast(null), 3500);
      };

      const addToCart = (product) => {
        setCart(prev => {
          const existing = prev.find(item => item.product.productId === product.productId);
          if (existing) {
            return prev.map(item => 
              item.product.productId === product.productId
                ? { ...item, quantity: item.quantity + 1 }
                : item
            );
          }
          return [...prev, { cartId: Date.now(), product, quantity: 1 }];
        });
        showToast(`Added "${product.title}" to cart!`);
      };

      const updateCartQuantity = (productId, delta) => {
        setCart(prev => 
          prev.map(item => {
            if (item.product.productId === productId) {
              const newQty = item.quantity + delta;
              return newQty > 0 ? { ...item, quantity: newQty } : null;
            }
            return item;
          }).filter(Boolean)
        );
      };

      const removeFromCart = (productId) => {
        setCart(prev => prev.filter(item => item.product.productId !== productId));
        showToast("Item removed from cart.", "info");
      };

      const clearCart = () => setCart([]);

      const addProduct = (newProd) => {
        const prod = {
          ...newProd,
          productId: Date.now(),
          images: [{ imageId: Date.now(), imageUrl: newProd.imageUrl || 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=800&q=80' }]
        };
        setProducts(prev => [prod, ...prev]);
        showToast("Product added to catalog successfully!");
      };

      const deleteProduct = (prodId) => {
        setProducts(prev => prev.filter(p => p.productId !== prodId));
        showToast("Product deleted.", "info");
      };

      const updateOrderStatus = (orderId, newStatus) => {
        setOrders(prev => prev.map(o => o.orderId === orderId ? { ...o, status: newStatus } : o));
        showToast(`Order #${orderId} status updated to ${newStatus}`);
      };

      const completeOrder = (paymentId) => {
        const subtotal = cart.reduce((acc, i) => acc + (i.product.price * i.quantity), 0);
        const shipping = 370.00;
        const total = subtotal + shipping;

        const newOrder = {
          orderId: Math.floor(1000 + Math.random() * 9000),
          orderDate: new Date().toLocaleString(),
          totalAmount: total,
          status: "PAID",
          paymentMethod: "RAZORPAY",
          razorpayPaymentId: paymentId,
          shippingAddress: currentUser ? currentUser.address : "Default Shipping Address",
          items: cart.map((item, idx) => ({
            orderItemId: Date.now() + idx,
            product: item.product,
            quantity: item.quantity,
            pricePerUnit: item.product.price
          }))
        };

        setOrders(prev => [newOrder, ...prev]);
        clearCart();
        setIsRazorpayOpen(false);
        setActivePage('orders');
        showToast(`Order #${newOrder.orderId} placed successfully!`);
      };

      const login = (role) => {
        if (role === 'ADMIN') {
          setCurrentUser({
            userId: 99,
            name: "Super Admin",
            email: "admin@salessavvy.com",
            role: "ADMIN",
            address: "Sales Savvy HQ, Silicon City"
          });
          setActivePage('admin');
          showToast("Logged in as Admin!");
        } else {
          setCurrentUser({
            userId: 1,
            name: "John Doe",
            email: "john@kodnest.com",
            role: "CUSTOMER",
            address: "123 Indiranagar, Bangalore, Karnataka"
          });
          setActivePage('home');
          showToast("Logged in as Customer!");
        }
      };

      const logout = () => {
        setCurrentUser(null);
        setActivePage('home');
        showToast("Logged out successfully.", "info");
      };

      return (
        <AppContext.Provider value={{
          currentUser, setCurrentUser,
          products, categories,
          cart, addToCart, updateCartQuantity, removeFromCart, clearCart,
          orders, updateOrderStatus, completeOrder,
          activePage, setActivePage,
          selectedCategory, setSelectedCategory,
          searchQuery, setSearchQuery,
          toast, showToast,
          quickViewProduct, setQuickViewProduct,
          isRazorpayOpen, setIsRazorpayOpen,
          addProduct, deleteProduct,
          login, logout
        }}>
          {children}
        </AppContext.Provider>
      );
    }

    // ==========================================
    // NAVBAR COMPONENT
    // ==========================================
    function Navbar() {
      const {
        currentUser, cart, activePage, setActivePage,
        searchQuery, setSearchQuery, selectedCategory, setSelectedCategory,
        categories, login, logout
      } = useContext(AppContext);

      const cartCount = cart.reduce((acc, item) => acc + item.quantity, 0);

      return (
        <header className="navbar">
          <div className="container nav-content">
            <div className="nav-brand" onClick={() => setActivePage('home')}>
              <div className="brand-logo-icon">SS</div>
              <span>SALES<span className="brand-accent">SAVVY</span></span>
            </div>

            <div className="nav-search-bar">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
              <input
                type="text"
                placeholder="Search products by title, category, keywords..."
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
              />
              {searchQuery && (
                <button className="search-clear-btn" onClick={() => setSearchQuery('')}>×</button>
              )}
            </div>

            <nav className="nav-actions">
              <button 
                className={`nav-btn ${activePage === 'home' ? 'active' : ''}`}
                onClick={() => setActivePage('home')}
              >
                Catalog
              </button>

              {currentUser && (
                <button 
                  className={`nav-btn ${activePage === 'orders' ? 'active' : ''}`}
                  onClick={() => setActivePage('orders')}
                >
                  My Orders
                </button>
              )}

              {currentUser?.role === 'ADMIN' && (
                <button 
                  className={`nav-btn ${activePage === 'admin' ? 'active' : ''}`}
                  onClick={() => setActivePage('admin')}
                >
                  <span className="badge badge-accent">Admin Console</span>
                </button>
              )}

              <button 
                className={`nav-btn cart-btn ${activePage === 'cart' ? 'active' : ''}`}
                onClick={() => setActivePage('cart')}
              >
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                <span>Cart</span>
                {cartCount > 0 && <span className="cart-badge">{cartCount}</span>}
              </button>

              <div className="user-profile-widget">
                {currentUser ? (
                  <div className="profile-pill">
                    <div className="user-avatar">{currentUser.name.charAt(0)}</div>
                    <div className="user-info-text">
                      <span className="user-name">{currentUser.name}</span>
                      <span className="user-role-badge">{currentUser.role}</span>
                    </div>
                    <button className="logout-btn" title="Logout" onClick={logout}>
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    </button>
                  </div>
                ) : (
                  <div className="auth-action-group">
                    <button className="btn btn-outline" onClick={() => setActivePage('login')}>Sign In</button>
                    <button className="btn btn-primary" onClick={() => setActivePage('register')}>Register</button>
                  </div>
                )}
              </div>
            </nav>
          </div>
        </header>
      );
    }

    // ==========================================
    // HERO BANNER & CUSTOMER HOME
    // ==========================================
    function CustomerHomePage() {
      const {
        products, categories, selectedCategory, setSelectedCategory,
        searchQuery, addToCart, setQuickViewProduct, setActivePage
      } = useContext(AppContext);

      const filtered = products.filter(p => {
        const matchesCategory = selectedCategory === 'ALL' || p.category.categoryName === selectedCategory;
        const matchesSearch = !searchQuery || 
          p.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
          p.description.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCategory && matchesSearch;
      });

      return (
        <div className="page-content">
          {/* Hero Section */}
          <section className="hero-section">
            <div className="container hero-container">
              <div className="hero-pill">
                <span className="pulse-dot"></span>
                <span>Next-Generation Spring Boot & React Commerce</span>
              </div>
              <h1 className="hero-title">
                Curated Luxury.<br />
                <span className="gradient-text">Engineered for Perfection.</span>
              </h1>
              <p className="hero-subtitle">
                Discover high-performance electronics, precision timepieces, and artisan craft. 
                Full-stack architecture designed per KodNest technical specifications.
              </p>
              <div className="hero-cta-group">
                <button 
                  className="btn btn-primary btn-lg"
                  onClick={() => {
                    const el = document.getElementById('catalog-grid');
                    if (el) el.scrollIntoView({ behavior: 'smooth' });
                  }}
                >
                  Explore Collection
                </button>
                <div className="hero-stat-pills">
                  <div className="stat-pill">
                    <span className="stat-val">₹370</span>
                    <span className="stat-lbl">Flat Shipping</span>
                  </div>
                  <div className="stat-pill">
                    <span className="stat-val">Razorpay</span>
                    <span className="stat-lbl">Secure Gateway</span>
                  </div>
                  <div className="stat-pill">
                    <span className="stat-val">Spring 3.2</span>
                    <span className="stat-lbl">Ready Backend</span>
                  </div>
                </div>
              </div>
            </div>
          </section>

          {/* Catalog Section */}
          <section id="catalog-grid" className="container catalog-section">
            <div className="catalog-header">
              <div>
                <h2 className="section-title">Explore Catalog</h2>
                <p className="section-sub">Showing {filtered.length} products carefully curated</p>
              </div>

              {/* Category Filter Pills */}
              <div className="filter-pill-group">
                <button 
                  className={`filter-pill ${selectedCategory === 'ALL' ? 'active' : ''}`}
                  onClick={() => setSelectedCategory('ALL')}
                >
                  All Products
                </button>
                {categories.map(cat => (
                  <button
                    key={cat.categoryId}
                    className={`filter-pill ${selectedCategory === cat.categoryName ? 'active' : ''}`}
                    onClick={() => setSelectedCategory(cat.categoryName)}
                  >
                    {cat.categoryName}
                  </button>
                ))}
              </div>
            </div>

            {/* Grid */}
            {filtered.length === 0 ? (
              <div className="empty-state">

    // ==========================================
    // RAZORPAY PAYMENT MODAL (TOPIC 7 SIMULATOR)
    // ==========================================
    function RazorpayModal() {
      const { isRazorpayOpen, setIsRazorpayOpen, cart, completeOrder, currentUser } = useContext(AppContext);
      const [paymentMethod, setPaymentMethod] = useState('UPI');
      const [isProcessing, setIsProcessing] = useState(false);
      const [upiId, setUpiId] = useState('kodnest@okhdfcbank');
      const [cardNumber, setCardNumber] = useState('4111 2222 3333 4444');

      if (!isRazorpayOpen) return null;

      const subtotal = cart.reduce((acc, i) => acc + (i.product.price * i.quantity), 0);
      const total = subtotal + 370.00;

      const handleSimulatePayment = () => {
        setIsProcessing(true);
        setTimeout(() => {
          setIsProcessing(false);
          const mockPaymentId = "pay_SAVVY_" + Math.random().toString(36).substring(2, 10).toUpperCase();
          completeOrder(mockPaymentId);
        }, 1800);
      };

      return (
        <div className="modal-backdrop">
          <div className="razorpay-modal-box">
            <div className="razorpay-top-bar">
              <div className="razorpay-logo">
                <span className="razorpay-text">Razorpay</span>
                <span className="razorpay-badge">SANDBOX TEST MODE</span>
              </div>
              <button className="modal-close-btn" onClick={() => setIsRazorpayOpen(false)}>×</button>
            </div>

            <div className="razorpay-order-banner">
              <div>
                <span className="rp-merchant">Sales Savvy E-Commerce Store</span>
                <h4 className="rp-amount">₹{total.toLocaleString('en-IN', { minimumFractionDigits: 2 })}</h4>
              </div>
              <div className="rp-order-ref">
                <span>ORDER REF:</span>
                <code>OD_{Date.now().toString().slice(-6)}</code>
              </div>
            </div>

            <div className="razorpay-body">
              <div className="payment-tab-row">
                <button 
                  className={`tab-btn ${paymentMethod === 'UPI' ? 'active' : ''}`}
                  onClick={() => setPaymentMethod('UPI')}
                >
                  UPI / QR
                </button>
                <button 
                  className={`tab-btn ${paymentMethod === 'CARD' ? 'active' : ''}`}
                  onClick={() => setPaymentMethod('CARD')}
                >
                  Cards (Visa/Mastercard)
                </button>
                <button 
                  className={`tab-btn ${paymentMethod === 'NETBANKING' ? 'active' : ''}`}
                  onClick={() => setPaymentMethod('NETBANKING')}
                >
                  Net Banking
                </button>
              </div>

              {paymentMethod === 'UPI' && (
                <div className="payment-form-content">
                  <label className="form-lbl">Enter Virtual Payment Address (VPA)</label>
                  <input 
                    type="text" 
                    className="form-input" 
                    value={upiId} 
                    onChange={e => setUpiId(e.target.value)}
                  />
                  <p className="form-hint">Fast checkout via Google Pay, PhonePe, Paytm, or BHIM.</p>
                </div>
              )}

              {paymentMethod === 'CARD' && (
                <div className="payment-form-content">
                  <label className="form-lbl">Test Card Number</label>
                  <input 
                    type="text" 
                    className="form-input" 
                    value={cardNumber} 
                    onChange={e => setCardNumber(e.target.value)}
                  />
                  <div className="form-two-cols">
                    <div>
                      <label className="form-lbl">Expiry</label>
                      <input type="text" className="form-input" defaultValue="12/28" />
                    </div>
                    <div>
                      <label className="form-lbl">CVV</label>
                      <input type="password" className="form-input" defaultValue="123" />
                    </div>
                  </div>
                </div>
              )}

              {paymentMethod === 'NETBANKING' && (
                <div className="payment-form-content">
                  <label className="form-lbl">Select Your Bank</label>
                  <select className="form-input">
                    <option>HDFC Bank</option>
                    <option>State Bank of India</option>
                    <option>ICICI Bank</option>
                    <option>Axis Bank</option>
                  </select>
                </div>
              )}

              <div className="shipping-verify-box">
                <span className="lbl">Deliver to:</span>
                <span className="val">{currentUser ? currentUser.address : "Default shipping address configured"}</span>
              </div>

              <button 
                className="btn btn-primary btn-block pay-cta"
                disabled={isProcessing}
                onClick={handleSimulatePayment}
              >
                {isProcessing ? "Verifying with Razorpay..." : `Pay ₹${total.toLocaleString('en-IN', { minimumFractionDigits: 2 })}`}
              </button>
            </div>
          </div>
        </div>
      );
    }

        e.preventDefault();
        showToast("Registration successful!");
        login(form.role);
      };

      return (
        <div className="container page-content auth-wrapper">
          <div className="auth-card">
            <div className="auth-header">
              <div className="brand-logo-icon auth-logo">SS</div>
              <h2>Create Savvy Account</h2>
              <p>Per Topic 3: Full client-side validation and role support</p>
            </div>

            <form onSubmit={handleSubmit} className="auth-form">
              <div className="form-group">
                <label>Full Name</label>
                <input 
                  type="text" 
                  required 
                  className="form-input" 
                  placeholder="John Doe"
                  value={form.name}
                  onChange={e => setForm({ ...form, name: e.target.value })}
                />
              </div>
              <div className="form-group">
                <label>Email Address</label>
                <input 
                  type="email" 
                  required 
                  className="form-input" 
                  placeholder="john@example.com"
                  value={form.email}
                  onChange={e => setForm({ ...form, email: e.target.value })}
                />
              </div>
              <div className="form-group">
                <label>Password (Min 8 chars, 1 uppercase, 1 special)</label>
                <input 
                  type="password" 
                  required 
                  className="form-input" 
                  placeholder="••••••••"
                  value={form.password}
                  onChange={e => setForm({ ...form, password: e.target.value })}
                />
              </div>
              <div className="form-group">
                <label>Account Role</label>
                <select 
                  className="form-input"
                  value={form.role}
                  onChange={e => setForm({ ...form, role: e.target.value })}
                >
                  <option value="CUSTOMER">Customer (Shopper)</option>
                  <option value="ADMIN">Administrator (Store Owner)</option>
                </select>
              </div>
              <div className="form-group">
                <label>Default Shipping Address</label>
                <input 
                  type="text" 
                  required 
                  className="form-input" 
                  placeholder="Street, City, State, PIN"
                  value={form.address}
                  onChange={e => setForm({ ...form, address: e.target.value })}
                />
              </div>
              <button type="submit" className="btn btn-primary btn-block">Complete Registration</button>
            </form>

            <div className="auth-switch-prompt">
              <span>Already registered? </span>
              <button className="link-btn" onClick={() => setActivePage('login')}>Sign In</button>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // QUICK VIEW MODAL
    // ==========================================
    function QuickViewModal() {
      const { quickViewProduct, setQuickViewProduct, addToCart } = useContext(AppContext);
      if (!quickViewProduct) return null;

      return (
        <div className="modal-backdrop" onClick={() => setQuickViewProduct(null)}>
          <div className="quickview-card" onClick={e => e.stopPropagation()}>
            <button className="modal-close-btn" onClick={() => setQuickViewProduct(null)}>×</button>
            <div className="quickview-layout">
              <div className="quickview-media">
                <img src={quickViewProduct.images?.[0]?.imageUrl} alt={quickViewProduct.title} />
              </div>
              <div className="quickview-details">
                <span className="product-cat-tag">{quickViewProduct.category.categoryName}</span>
                <h2 className="quickview-title">{quickViewProduct.title}</h2>
                <div className="quickview-price">
                  ₹{quickViewProduct.price.toLocaleString('en-IN', { minimumFractionDigits: 2 })}
                </div>
                <p className="quickview-desc">{quickViewProduct.description}</p>
                
                <div className="quickview-stock">
                  <span>Status:</span>
                  <strong style={{ color: 'var(--accent-emerald)' }}>In Stock ({quickViewProduct.stockQuantity} available)</strong>
                </div>

                <div className="quickview-actions">
                  <button 
                    className="btn btn-primary btn-lg"
                    onClick={() => {
                      addToCart(quickViewProduct);
                      setQuickViewProduct(null);
                    }}
                  >
                    Add to Bag • ₹{quickViewProduct.price.toLocaleString('en-IN')}
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // TOAST NOTIFICATIONS
    // ==========================================
    function Toast() {
      const { toast } = useContext(AppContext);
      if (!toast) return null;

      return (
        <div className={`toast-notification toast-${toast.type}`}>
          <span className="toast-icon">
            {toast.type === 'success' ? '✓' : 'ℹ'}
          </span>
          <span className="toast-msg">{toast.message}</span>
        </div>
      );
    }

    // ==========================================
    // FOOTER
    // ==========================================
    function Footer() {
      return (
        <footer className="footer-wrap">
          <div className="container footer-grid">
            <div className="footer-col">
              <div className="nav-brand">
                <div className="brand-logo-icon">SS</div>
                <span>SALES<span className="brand-accent">SAVVY</span></span>
              </div>
              <p className="footer-lead">
                Enterprise e-commerce platform built to strict KodNest project specifications. 
                Full support for MySQL relational schemas, Spring Boot 3.2.4 REST services, and Razorpay Sandbox.
              </p>
            </div>
            <div className="footer-col">
              <h4>System Architecture</h4>
              <ul>
                <li>Spring Boot 3.2.4 (Java)</li>
                <li>MySQL 8.0 Relational RDBMS</li>
                <li>JJWT 0.11.5 Authentication</li>
                <li>Razorpay Sandbox Integration</li>
              </ul>
            </div>
            <div className="footer-col">
              <h4>SRS Modules</h4>
              <ul>
                <li>Topic 1: SRS & Role Matrix</li>
                <li>Topic 3: User Registration</li>
                <li>Topic 5: Catalog Filtering</li>
                <li>Topic 6 & 7: Cart & Payments</li>
              </ul>
            </div>
          </div>
          <div className="container footer-bottom">
            <span>© 2026 Sales Savvy. Crafted with Obsidian Luxe & Auric Luminescence.</span>
            <span>API Server Wire: <code>http://localhost:9090</code></span>
          </div>
        </footer>
      );
    }

    // ==========================================
    // MAIN APP ROUTER
    // ==========================================
    function App() {
      const { activePage } = useContext(AppContext);

      return (
        <div className="app-shell">
          <Navbar />
          <main className="main-viewport">
            {activePage === 'home' && <CustomerHomePage />}
            {activePage === 'cart' && <CartPage />}
            {activePage === 'orders' && <OrderHistoryPage />}
            {activePage === 'admin' && <AdminDashboard />}
            {activePage === 'login' && <LoginPage />}
            {activePage === 'register' && <RegisterPage />}
          </main>
          <Footer />
          <QuickViewModal />
          <RazorpayModal />
          <Toast />
        </div>
      );
    }

    // Mount Application
    ReactDOM.createRoot(document.getElementById('root')).render(
      <AppProvider>
        <App />
      </AppProvider>
    );
  </script>
</body>
</html>
