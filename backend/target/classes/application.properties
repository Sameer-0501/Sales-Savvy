# ==============================================================================
# Sales Savvy - Spring Boot Configuration
# Server Port & Endpoint settings
# ==============================================================================
server.port=9090

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/salessavvy?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root123@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration (Minimum 64 bytes secret for HMAC-SHA512)
jwt.secret=salesSavvySuperSecretKeyThatIsAtLeast64BytesLongForHmacSha512SecurityRequirement1234567890
jwt.expiration=3600000

# CORS Configuration
# Supporting both port 5173 (standard Vite) and port 5174 (specified in KodNest slides)
cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:3000
